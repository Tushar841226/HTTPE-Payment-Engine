# ==========================================
# APPLICATION
# ==========================================

spring.application.name=notification-service

server.port=8082


# ==========================================
# KAFKA SERVER
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# KAFKA CONSUMER
# ==========================================

spring.kafka.consumer.group-id=notification-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# ==========================================
# JSON DESERIALIZATION
# ==========================================

# IMPORTANT:
# Ignore the Java class name sent by auth-service
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Tell notification-service which class to create
spring.kafka.consumer.properties.spring.json.value.default.type=com.httpe.notification.dto.PaymentNotification

# Only trust notification DTO package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.httpe.notification.dto


# ==========================================
# KAFKA LISTENER
# ==========================================

spring.kafka.listener.missing-topics-fatal=false


# ==========================================
# PAYMENT TOPIC
# ==========================================

payment.kafka.topic=payment-topic
# ================================
# REDIS
# ================================
spring.data.redis.host=localhost